[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stayops-ai"
version = "0.1.0"
description = "A multi-agent short-term rental operations manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
